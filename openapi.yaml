openapi: 3.0.3
info:
  title: CRUD API
  description: Product CRUD API backed by ASP.NET Core and SQL Server.
  version: 1.0.0
servers:
  - url: http://localhost:5050
    description: Local development
paths:
  /:
    get:
      summary: Get API status
      operationId: getApiStatus
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required: [name, status]
                properties:
                  name:
                    type: string
                    example: CRUD API
                  status:
                    type: string
                    example: running
  /api/products:
    get:
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: Products ordered by ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              name: Keyboard
              price: 49.99
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              name: Mechanical Keyboard
              price: 79.99
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int32
        minimum: 1
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          maxLength: 200
          example: Keyboard
        price:
          type: number
          format: double
          minimum: 0
          example: 49.99
    ProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          example: Keyboard
        price:
          type: number
          format: double
          minimum: 0
          example: 49.99
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        traceId:
          type: string
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: Product was not found
